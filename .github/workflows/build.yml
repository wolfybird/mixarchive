# Builds the package and installs it the way a new user would (a fresh environment, no
# extras, nothing from the checkout), then checks it runs: on Windows, macOS and Linux, on
# the oldest and newest Python it supports. On Python 3.10, pip must refuse it and a clone
# run must say to upgrade.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel into a new environment, no extras (all it needs comes with it)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/env"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/env/Scripts"; else bin="$RUNNER_TEMP/env/bin"; fi
          echo "BIN=$bin" >> "$GITHUB_ENV"
          wheel=$(ls dist/*.whl)
          "$bin/python" -m pip install "$wheel"
          # the old install line, with the (now empty) extras, still resolves without a warning
          "$bin/python" -m pip install --dry-run "${wheel}[app,rekordbox]" > "$RUNNER_TEMP/extras.log" 2>&1 || { cat "$RUNNER_TEMP/extras.log"; exit 1; }
          if grep -qi "does not provide the extra" "$RUNNER_TEMP/extras.log"; then cat "$RUNNER_TEMP/extras.log"; exit 1; fi
      - name: Run it from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$BIN/mixarchive" --help > /dev/null
          "$BIN/mixarchive" list
          "$BIN/python" -I - <<'EOF'
          import os, sys, urllib.request, threading
          import mixarchive
          from mixarchive.util import APP_DIR, EXE, reinstall_hint, settings
          from mixarchive import gui
          pkg = os.path.dirname(mixarchive.__file__)
          s = settings()
          print("data folder:", APP_DIR)
          print("yt-dlp:", s["ytdlp"])
          print("rekordbox python:", s["rbpython"])
          assert pkg not in APP_DIR, "data folder inside the package"
          assert os.path.isfile(s["ytdlp"]), "yt-dlp not found next to Python"
          assert s["rbpython"] == sys.executable
          for f in ("gui.html", "gui_hybrid.html", "gui_skin.js", "gui_progress.js", "rbdb.py", "rbfiles.py", "rbmerge.py"):
              assert os.path.isfile(os.path.join(pkg, f)), f + " missing from the package"
          import importlib.util
          import mutagen, numpy, PIL, pyrekordbox, webview, yt_dlp      # every dependency, no extras
          assert importlib.util.find_spec("yt_dlp_plugins.extractor.getpot_bgutil_http"), "PO token plugin missing"
          assert os.path.isfile(os.path.join(os.path.dirname(s["ytdlp"]), "deno" + EXE)), "deno missing"
          assert reinstall_hint().endswith("-m pip install mixarchive"), reinstall_hint()   # a plain pip venv
          server, address, job = gui.make_server(8799)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          for page in ("hybrid", "classic", "music"):
              url = address.replace("/?t=", gui.page_path(page) + "?t=", 1)
              assert urllib.request.urlopen(url).status == 200, page
          server.shutdown()
          print("ok")
          EOF

  old-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: pip refuses it on 3.10, and running a clone says to upgrade
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          if python -m pip install dist/*.whl > pip.log 2>&1; then cat pip.log; exit 1; fi
          # old pips name whichever Requires-Python they hit first (this one's, or pyrekordbox's)
          grep -qiE "requires-python|requires a different python" pip.log || { cat pip.log; exit 1; }
          if python -m mixarchive --help > run.log 2>&1; then cat run.log; exit 1; fi
          grep -q "needs Python 3.11 or newer" run.log || { cat run.log; exit 1; }
          cat run.log
