# Publishing a GitHub release (tag vX.Y.Z, matching the version in pyproject.toml) uploads
# that version to PyPI. PyPI's trusted publishing checks that the upload comes from this
# workflow in this repository, so no PyPI password or token is stored anywhere. One-time
# setup on pypi.org: Account settings > Publishing > add a (pending) publisher with owner
# wolfybird, repository mixarchive, workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The tag matches the package version
        run: |
          python - <<'EOF'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          code = re.search(r'__version__ = "([^"]+)"', open("mixarchive/__init__.py").read())[1]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version == code, f"tag {tag}, pyproject.toml {version}, __init__.py {code}"
          EOF
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
