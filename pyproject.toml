[project]
name = "mixarchive"
version = "0.3.0"
description = "Archive YouTube channels and long mixes as tagged tracks, and sync them into rekordbox for CDJ/XDJ"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"     # pyrekordbox 0.5 and current yt-dlp need 3.11
keywords = ["youtube", "rekordbox", "dj", "mixes", "tracklists", "yt-dlp", "cdj", "xdj"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
# everything mixarchive uses comes with `pip install mixarchive` (ffmpeg, not a Python
# package, is installed separately: README > Install)
dependencies = [
    "yt-dlp[default]",              # downloads (with yt-dlp-ejs for YouTube's JavaScript)
    "deno",                         # the JavaScript runtime yt-dlp needs for YouTube
    "bgutil-ytdlp-pot-provider",    # yt-dlp plugin: PO tokens for the 403 retry (README > Setup)
    "mutagen",                      # tags
    "pillow",                       # cover art
    "numpy",                        # files silence, merge
    # rbsync, files, merge, monitor: rekordbox's database. Its driver (sqlcipher3-wheels) has
    # ready-made builds only up to Python 3.14 so far; on 3.15 pip would compile it (minutes, and a
    # C compiler), so there it's the [rekordbox] extra (util.REKORDBOX_PYTHON has the same bound)
    "pyrekordbox==0.5.0; python_version < '3.15'",
    "rekfix>=0.2.1",                # monitor: the sticks' databases and cues
    "pywebview>=6",                 # `mixarchive app` / `mixarchive-app`: the window
]

[project.optional-dependencies]
# app: empty, the window is in the base install (kept so `mixarchive[app,rekordbox]` still
# installs). rekordbox: the same as the base install up to Python 3.14; on 3.15 it brings
# pyrekordbox, compiling its database driver (see dependencies)
app = []
rekordbox = ["pyrekordbox==0.5.0"]

[project.urls]
Homepage = "https://github.com/wolfybird/mixarchive"
Issues = "https://github.com/wolfybird/mixarchive/issues"
"Ko-fi" = "https://ko-fi.com/rfrank"
"Buy Me a Coffee" = "https://buymeacoffee.com/wolfybird"

[project.scripts]
mixarchive = "mixarchive.cli:main"

[project.gui-scripts]
mixarchive-app = "mixarchive.cli:app_main"   # no console window on Windows

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mixarchive"]

[tool.setuptools.package-data]
mixarchive = ["gui*.html", "gui_skin.js", "gui_progress.js"]
