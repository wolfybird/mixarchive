[project]
name = "mixarchive"
version = "0.2.0"
description = "Archive YouTube channels and long mixes as tagged tracks, and sync them into rekordbox for CDJ/XDJ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"     # pyrekordbox 0.5 and current yt-dlp need 3.11
keywords = ["youtube", "rekordbox", "dj", "mixes", "tracklists", "yt-dlp", "cdj", "xdj"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["yt-dlp[default]", "deno", "mutagen", "pillow"]

[project.optional-dependencies]
app = ["pywebview>=6"]              # `mixarchive app` / `mixarchive-app`: the GUI in a window of its own
rekordbox = ["pyrekordbox==0.5.0"]  # rbsync, files, merge: rekordbox's database

[project.urls]
Homepage = "https://github.com/wolfybird/mixarchive"
Issues = "https://github.com/wolfybird/mixarchive/issues"

[project.scripts]
mixarchive = "mixarchive.cli:main"

[project.gui-scripts]
mixarchive-app = "mixarchive.cli:app_main"   # no console window on Windows

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mixarchive"]

[tool.setuptools.package-data]
mixarchive = ["gui*.html", "gui_skin.js", "gui_progress.js"]
